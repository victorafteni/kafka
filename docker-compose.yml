version: '3.8'

services:
  # 1. Frontend Commerce SPA
  commerce-spa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commerce-hub-spa
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - commerce-net

  # 2. Redis Cache & Session Store (V2 ready)
  redis:
    image: redis:7-alpine
    container_name: commerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - commerce-net

  # 3. Zookeeper for Kafka Cluster coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: commerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - commerce-net

  # 4. Apache Kafka Broker (V2 event streaming pipeline)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: commerce-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - commerce-net

networks:
  commerce-net:
    driver: bridge

volumes:
  redis-data:
